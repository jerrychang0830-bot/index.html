<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b45">
<title>旅遊筆記</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#123b45; --primary:#0f8b8d; --accent:#ef6f53; --gold:#e6a532;
    --bg:#f2f6f7; --card:#ffffff; --line:#dde6ea; --muted:#5f7684; --sand:#fbf5ea;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7; padding-bottom:64px;}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px}

  .citybar{position:sticky;top:0;z-index:1000;background:var(--bg);
    border-bottom:1px solid var(--line);padding:10px 0}
  .cities{display:flex;gap:8px;overflow-x:auto;padding:0 16px;max-width:680px;
    margin:0 auto;scrollbar-width:none}
  .cities::-webkit-scrollbar{display:none}
  .ctab{white-space:nowrap;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:7px 16px;font-size:14px;
    font-weight:700;cursor:pointer}
  .ctab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .ctab.add{border-style:dashed;color:var(--accent);border-color:var(--accent)}

  header{position:relative;color:#fff;padding:32px 0 26px;overflow:hidden}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;
    background:var(--bg);
    -webkit-mask:radial-gradient(14px at 14px 22px,transparent 98%,#000) repeat-x;
    mask:radial-gradient(14px at 14px 22px,transparent 98%,#000) repeat-x;
    -webkit-mask-size:28px 22px;mask-size:28px 22px}
  .eyebrow{font-size:13px;letter-spacing:.3em;opacity:.85;margin:0 0 4px}
  h1{margin:0;font-size:50px;font-weight:800;letter-spacing:.06em;line-height:1}
  .sub{margin:8px 0 0;font-size:15px;letter-spacing:.1em;opacity:.92}
  .highlight{margin-top:18px;background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:11px 13px;
    font-size:13.5px;display:flex;gap:9px;align-items:flex-start}
  .highlight .dot{color:var(--gold);font-size:17px;line-height:1.3}
  .hero-in input,.hero-in textarea{width:100%;border:none;border-radius:9px;
    padding:8px 10px;font-family:inherit;margin-top:8px;
    background:rgba(255,255,255,.9);color:var(--ink)}
  .hero-in .h-title{font-size:30px;font-weight:800}
  .themes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.7);cursor:pointer}
  .sw.on{outline:2px solid #fff;outline-offset:2px}
  .del-city{margin-top:12px;border:1px solid rgba(255,255,255,.6);background:transparent;
    color:#fff;border-radius:9px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}

  .pills{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;
    max-width:680px;margin:0 auto;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{white-space:nowrap;border:1px solid var(--line);background:var(--card);
    color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13.5px;
    font-weight:600;text-decoration:none}

  #mapbox{height:300px;border-radius:14px;overflow:hidden;margin:16px 0 6px;
    border:1px solid var(--line);z-index:1}
  #mapnote{display:none;font-size:13px;color:var(--muted);background:var(--sand);
    border:1px solid var(--line);border-radius:12px;padding:12px;margin:16px 0 6px;text-align:center}
  .maphint{font-size:12px;color:var(--muted);margin:0 0 6px;text-align:right}
  .numpin{background:var(--accent);color:#fff;border-radius:50%;width:26px;height:26px;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
    border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
  .leaflet-popup-content{font-family:inherit;font-size:14px}
  .leaflet-popup-content a{color:var(--primary);font-weight:700}
  #maplegend{display:none;flex-wrap:wrap;gap:6px 14px;margin:0 0 10px;font-size:12.5px;color:var(--muted)}
  .legend-chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .legend-chip i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}

  section{margin:22px 0}
  .s-head{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}
  .s-tag{font-size:11px;font-weight:700;letter-spacing:.16em;color:#fff;
    background:var(--primary);border-radius:5px;padding:3px 8px}
  .s-tag.accent{background:var(--accent)}
  .s-tag.gold{background:var(--gold)}
  .s-tag.ink{background:var(--ink)}
  .s-head h2{margin:0;font-size:21px;font-weight:800}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 15px;margin-bottom:10px}
  .card.hasdetail .read-only{cursor:pointer}
  .card .name{font-weight:700;font-size:16.5px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .badge{font-size:11px;font-weight:700;color:var(--accent);
    border:1px solid var(--accent);border-radius:6px;padding:1px 7px}
  .caret{margin-left:auto;color:var(--muted);font-size:13px;transition:transform .2s}
  .card .note{margin:5px 0 0;font-size:14px;color:var(--muted)}
  .detail{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
    font-size:14px;color:var(--ink);line-height:1.75}
  .card.open .detail{display:block}
  .card.open .caret{transform:rotate(180deg)}

  .fab{position:fixed;right:16px;bottom:16px;z-index:1200;background:var(--ink);
    color:#fff;border:none;border-radius:999px;padding:12px 18px;font-size:15px;
    font-weight:700;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.24)}
  .fab.editing{background:var(--accent)}
  .toolbar{display:none;gap:8px;flex-wrap:wrap;margin:14px 0 0}
  body.edit .toolbar{display:flex}
  .tbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;
    padding:8px 12px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink)}
  .tbtn.warn{color:var(--accent);border-color:var(--accent)}
  body.edit .card{border-style:dashed;border-color:var(--primary)}
  .edit-only{display:none}
  body.edit .edit-only{display:block}
  body.edit .read-only{display:none}
  input.f,textarea.f{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:14px;font-family:inherit;color:var(--ink);
    background:var(--sand);margin-top:6px}
  textarea.f{resize:vertical;min-height:44px}
  .geo{display:flex;gap:8px}
  .geo input{flex:1}
  .mini{border:none;background:transparent;color:var(--accent);font-size:13px;
    font-weight:700;cursor:pointer;padding:4px 0}
  .add-item{width:100%;border:1px dashed var(--primary);background:var(--sand);
    color:var(--primary);border-radius:10px;padding:9px;font-weight:700;cursor:pointer;font-size:14px}
  .add-sec{width:100%;border:1px dashed var(--accent);background:#fff;color:var(--accent);
    border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-size:15px;margin:8px 0 30px}
  .sec-edit{display:none;gap:8px;align-items:center;margin-bottom:10px}
  body.edit .sec-edit{display:flex}
  .del-sec{border:none;background:transparent;color:var(--accent);font-size:20px;cursor:pointer}

  footer{text-align:center;color:var(--muted);font-size:12.5px;margin:34px 0 10px;padding:0 16px}
  .updated{font-size:12px;color:var(--muted);text-align:right;margin:8px 16px 0}
</style>
</head>
<body>

<div class="citybar"><div class="cities" id="cities"></div></div>
<header><div class="wrap hero-in" id="hero"></div></header>
<div class="pills" id="pills"></div>

<div class="wrap">
  <p class="updated" id="updated"></p>
  <p class="maphint" id="maphint" style="display:none">路線總覽・可捏放縮放・點標記可 Google 導航</p>
  <div id="mapbox" style="display:none"></div>
  <div id="maplegend" style="display:none"></div>
  <div id="mapnote">🗺️ 地圖需要連網才能顯示（清單與介紹離線可看）</div>
  <div id="app"></div>
  <button class="add-sec edit-only" onclick="addSection()">＋ 新增分類</button>
  <div class="toolbar">
    <button class="tbtn" onclick="save()">💾 儲存變更</button>
    <button class="tbtn" onclick="document.getElementById('importer').click()">⬆ 匯入</button>
    <button class="tbtn" onclick="exportJSON()">⬇ 匯出備份</button>
    <button class="tbtn warn" onclick="resetAll()">↺ 還原預設</button>
  </div>
  <input type="file" id="importer" accept="application/json,.json" style="display:none">
  <footer>切換上方城市看不同筆記・點卡片展開介紹・右下角 🔧 隨時修改<br>資料存在這台裝置・出發前請再查證票價與營業時間</footer>
</div>

<button class="fab" id="fab" onclick="toggleEdit()">🔧 編輯</button>

<script>
"use strict";
var KEY="travel_hub_v1";
var mem=null;
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return mem;}}
function persist(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){mem=o;}}

var THEMES={
  coast:{name:"海岸綠",ink:"#123b45",primary:"#0f8b8d",accent:"#ef6f53",gold:"#e6a532"},
  sea:{name:"碧海藍",ink:"#17324a",primary:"#1f6f9c",accent:"#c9512f",gold:"#d99a2b"},
  forest:{name:"山林綠",ink:"#1c3327",primary:"#2f7d4f",accent:"#d98324",gold:"#c9a227"},
  sunset:{name:"暮色紫",ink:"#3a2438",primary:"#a8478a",accent:"#ef6f53",gold:"#e6a532"},
  night:{name:"墨夜藍",ink:"#1a2740",primary:"#3a5a8c",accent:"#d16a4a",gold:"#d9a441"}
};
function hexRgba(h,a){var n=parseInt(h.slice(1),16);return"rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function applyTheme(id){
  var t=THEMES[id]||THEMES.coast, r=document.documentElement.style;
  r.setProperty("--ink",t.ink);r.setProperty("--primary",t.primary);
  r.setProperty("--accent",t.accent);r.setProperty("--gold",t.gold);
  document.querySelector("meta[name=theme-color]").setAttribute("content",t.primary);
  document.querySelector("header").style.background=
    "radial-gradient(120% 90% at 85% 8%,"+hexRgba(t.gold,.5)+", transparent 55%),"+
    "linear-gradient(135deg,"+t.primary+" 0%,"+t.accent+" 135%)";
}

      {name:"都蘭糖廠",badge:"",note:"台11線往北，文創聚落。",detail:"舊糖廠改建的文創聚落，有工作室、咖啡、選物小店與不定期市集、音樂表演，適合悠閒晃一圈、喝杯咖啡。",lat:22.8830,lng:121.2360,q:"都蘭糖廠"},

      {name:"小魚山公園",badge:"日落",note:"360° 看棧橋老城，傍晚最美；地鐵3號線大學路站。"}]},

      {name:"啤酒節三大會場",badge:"季節",note:"金沙灘（西海岸）／嶗山／老城，7 月中–8 月中。"},
      {name:"原漿啤酒",badge:"必試",note:"塑膠袋裝生啤是青島日常。"}]},

      {name:"海鮮（蛤蜊・扇貝・大蝦）",badge:"",note:"清蒸或炭烤原味，配冰啤。"},

      {name:"市區交通",badge:"",note:"地鐵 3 號線串起老城主要景點。"},

var data=seed();
if(data.active>=data.cities.length)data.active=0;
var editing=false;
function city(){return data.cities[data.active];}

function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function renderCities(){
  var box=document.getElementById("cities");box.innerHTML="";
  data.cities.forEach(function(c,i){
    var b=el("button","ctab"+(i===data.active?" on":""),esc(c.title||"未命名"));
    b.onclick=function(){switchCity(i);};box.appendChild(b);
  });
  if(editing){var add=el("button","ctab add","＋ 城市");add.onclick=addCity;box.appendChild(add);}
}

function renderHero(){
  var h=document.getElementById("hero");h.innerHTML="";var c=city();
  if(!editing){
    h.appendChild(el("p","eyebrow",esc(c.eyebrow||"")));
    h.appendChild(el("h1",null,esc(c.title||"")));
    h.appendChild(el("p","sub",esc(c.sub||"")));
    var hl=el("div","highlight");hl.appendChild(el("span","dot","◆"));
    hl.appendChild(el("span",null,esc(c.highlight||"")));h.appendChild(hl);
  }else{
    var ie=el("input");ie.placeholder="小標";ie.value=c.eyebrow||"";ie.oninput=function(){c.eyebrow=this.value;};
    var it=el("input","h-title");it.placeholder="城市名";it.value=c.title||"";it.oninput=function(){c.title=this.value;renderCities();};
    var is=el("input");is.placeholder="副標";is.value=c.sub||"";is.oninput=function(){c.sub=this.value;};
    var ih=el("textarea");ih.placeholder="本季亮點";ih.rows=3;ih.value=c.highlight||"";ih.oninput=function(){c.highlight=this.value;};
    h.appendChild(ie);h.appendChild(it);h.appendChild(is);h.appendChild(ih);
    var th=el("div","themes");
    Object.keys(THEMES).forEach(function(k){
      var sw=el("button","sw"+(c.theme===k?" on":""));sw.title=THEMES[k].name;
      sw.style.background=THEMES[k].primary;
      sw.onclick=function(){c.theme=k;applyTheme(k);renderHero();};th.appendChild(sw);
    });
    h.appendChild(th);
    if(data.cities.length>1){var dc=el("button","del-city","🗑 刪除此城市");dc.onclick=delCity;h.appendChild(dc);}
  }
}

function renderPills(){
  var p=document.getElementById("pills");p.innerHTML="";
  city().sections.forEach(function(sec,si){
    var a=el("a","pill",esc(sec.title));a.href="#sec"+si;p.appendChild(a);
  });
}

function renderApp(){
  var app=document.getElementById("app");app.innerHTML="";var c=city();
  c.sections.forEach(function(sec,si){
    var s=el("section");s.id="sec"+si;
    var se=el("div","sec-edit");
    var st=el("input","f");st.value=sec.title;st.style.marginTop="0";st.oninput=function(){sec.title=this.value;renderPills();};
    var ds=el("button","del-sec","🗑");ds.onclick=function(){if(confirm("刪除整個分類？")){c.sections.splice(si,1);renderApp();renderPills();}};
    se.appendChild(st);se.appendChild(ds);s.appendChild(se);

    var hw=el("div","read-only");var head=el("div","s-head");
    head.appendChild(el("span","s-tag "+(sec.color||""),esc(sec.tag||"")));
    head.appendChild(el("h2",null,esc(sec.title)));hw.appendChild(head);s.appendChild(hw);

    sec.items.forEach(function(it,ii){
      var card=el("div","card"+(it.detail?" hasdetail":""));
      var ro=el("div","read-only");
      var nm=el("div","name",esc(it.name));
      if(it.badge)nm.appendChild(el("span","badge",esc(it.badge)));
      if(it.detail)nm.appendChild(el("span","caret","▾"));
      ro.appendChild(nm);
      if(it.note)ro.appendChild(el("p","note",esc(it.note)));
      if(it.detail){
        ro.appendChild(el("div","detail",esc(it.detail)));
        ro.onclick=function(){card.classList.toggle("open");};
      }
      card.appendChild(ro);
      var eo=el("div","edit-only");
      var fn=el("input","f");fn.placeholder="名稱";fn.value=it.name||"";fn.oninput=function(){it.name=this.value;};
      var fb=el("input","f");fb.placeholder="標籤（可留白）";fb.value=it.badge||"";fb.oninput=function(){it.badge=this.value;};
      var ft=el("textarea","f");ft.placeholder="一句話說明";ft.value=it.note||"";ft.oninput=function(){it.note=this.value;};
      var fdd=el("textarea","f");fdd.placeholder="詳細介紹（點擊展開的內容，可留白）";fdd.value=it.detail||"";fdd.oninput=function(){it.detail=this.value;};
      var geo=el("div","geo");
      var fla=el("input","f");fla.placeholder="緯度 lat（可留白）";fla.value=(it.lat!=null?it.lat:"");fla.oninput=function(){it.lat=this.value===""?undefined:parseFloat(this.value);};
      var flo=el("input","f");flo.placeholder="經度 lng";flo.value=(it.lng!=null?it.lng:"");flo.oninput=function(){it.lng=this.value===""?undefined:parseFloat(this.value);};
      geo.appendChild(fla);geo.appendChild(flo);
      eo.appendChild(fn);eo.appendChild(fb);eo.appendChild(ft);eo.appendChild(fdd);eo.appendChild(geo);
      var del=el("button","mini","－ 刪除這項");del.onclick=function(){sec.items.splice(ii,1);renderApp();};
      eo.appendChild(del);card.appendChild(eo);s.appendChild(card);
    });
    var add=el("button","add-item edit-only","＋ 新增一項");
    add.onclick=function(){sec.items.push({name:"",badge:"",note:""});renderApp();};s.appendChild(add);
    app.appendChild(s);
  });
  renderMap();
}

var DAYCOLORS=["#1f6f9c","#ef6f53","#2f7d4f","#a8478a","#d99a2b","#3a5a8c","#c9512f","#0f8b8d","#7a5cc0"];
var mapObj=null;
function renderMap(){
  var box=document.getElementById("mapbox"),note=document.getElementById("mapnote"),hint=document.getElementById("maphint"),legend=document.getElementById("maplegend");
  if(mapObj){mapObj.remove();mapObj=null;}
  var hide=function(){box.style.display="none";note.style.display="none";hint.style.display="none";if(legend)legend.style.display="none";};
  if(editing){hide();return;}
  var groups=[];
  city().sections.forEach(function(sec){
    var pts=sec.items.filter(function(it){return typeof it.lat==="number"&&typeof it.lng==="number"&&!isNaN(it.lat)&&!isNaN(it.lng);});
    if(pts.length)groups.push({title:sec.title,pts:pts});
  });
  if(!groups.length){hide();return;}
  if(!window.L){box.style.display="none";hint.style.display="none";if(legend)legend.style.display="none";note.style.display="block";return;}
  note.style.display="none";box.style.display="block";hint.style.display="block";
  mapObj=L.map(box,{scrollWheelZoom:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(mapObj);
  var all=[];
  if(legend){legend.innerHTML="";legend.style.display="flex";}
  groups.forEach(function(g,gi){
    var color=DAYCOLORS[gi%DAYCOLORS.length];
    var lls=[];
    g.pts.forEach(function(it,i){
      var ll=[it.lat,it.lng];lls.push(ll);all.push(ll);
      var icon=L.divIcon({className:"",html:'<div class="numpin" style="background:'+color+'">'+(i+1)+'</div>',iconSize:[26,26],iconAnchor:[13,13]});
      var query=encodeURIComponent(it.q||it.name);
      L.marker(ll,{icon:icon}).addTo(mapObj).bindPopup(
        '<b>'+esc(g.title)+' ・ '+(i+1)+'. '+esc(it.name)+'</b><br><a href="https://www.google.com/maps/search/?api=1&query='+query+'" target="_blank" rel="noopener">Google 導航 ↗</a>');
    });
    if(lls.length>1)L.polyline(lls,{color:color,weight:3,opacity:.75}).addTo(mapObj);
    if(legend){var chip=el("span","legend-chip");chip.innerHTML='<i style="background:'+color+'"></i>'+esc(g.title);legend.appendChild(chip);}
  });
  if(all.length>1)mapObj.fitBounds(all,{padding:[34,34]});else mapObj.setView(all[0],13);
  setTimeout(function(){mapObj&&mapObj.invalidateSize();},120);
}

function renderAll(){
  applyTheme(city().theme);renderCities();renderHero();renderPills();renderApp();
  document.getElementById("updated").textContent=data.updated?("更新 "+data.updated):"";
}

function switchCity(i){data.active=i;if(editing){editing=false;document.body.classList.remove("edit");resetFab();}renderAll();window.scrollTo(0,0);}
function resetFab(){var f=document.getElementById("fab");f.textContent="🔧 編輯";f.classList.remove("editing");}
function toggleEdit(){
  editing=!editing;document.body.classList.toggle("edit",editing);
  var f=document.getElementById("fab");f.textContent=editing?"✓ 完成":"🔧 編輯";f.classList.toggle("editing",editing);
  if(!editing)save(true);
  renderCities();renderHero();renderApp();
}
function addCity(){
  data.cities.push({eyebrow:"",title:"新城市",sub:"",theme:"forest",highlight:"",
    sections:[{tag:"分類",color:"",title:"新分類",items:[{name:"",badge:"",note:""}]}]});
  data.active=data.cities.length-1;renderAll();window.scrollTo(0,0);
}
function delCity(){
  if(data.cities.length<=1)return;
  if(confirm("刪除「"+city().title+"」整個城市？")){data.cities.splice(data.active,1);data.active=0;renderAll();}
}
function addSection(){
  city().sections.push({tag:"新分類",color:"",title:"新分類",items:[{name:"",badge:"",note:""}]});
  renderApp();renderPills();
}
function save(silent){data.updated=new Date().toISOString().slice(0,10);persist(data);
  document.getElementById("updated").textContent="更新 "+data.updated;if(!silent)alert("已儲存到這台裝置 ✓");}
function exportJSON(){var b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="travel-backup.json";a.click();}
function resetAll(){if(confirm("還原成預設內容？你目前的修改會消失。")){data=seed();persist(data);editing=false;
  document.body.classList.remove("edit");resetFab();renderAll();}}

document.getElementById("importer").onchange=function(ev){
  var f=ev.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      var incoming=obj.cities?obj.cities:(obj.sections?[obj]:null);
      if(!incoming){alert("檔案格式不符");return;}
      incoming.forEach(function(c){
        var idx=-1;for(var i=0;i<data.cities.length;i++){if(data.cities[i].title===c.title){idx=i;break;}}
        if(idx>=0)data.cities[idx]=c;else data.cities.push(c);
      });
      data.active=data.cities.length-1;persist(data);renderAll();window.scrollTo(0,0);
      alert("已匯入 ✓");
    }catch(e){alert("讀取失敗："+e.message);}
    ev.target.value="";
  };
  r.readAsText(f);
};

renderAll();
</script>
